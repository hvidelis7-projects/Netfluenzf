<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Trifluenz logo">
  <defs>
    <!-- Premium gunmetal -->
    <linearGradient id="tf-metal" x1="44" y1="104" x2="212" y2="232" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B8C4D4"/>
      <stop offset="0.18" stop-color="#64748B"/>
      <stop offset="0.48" stop-color="#1E293B"/>
      <stop offset="0.82" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="tf-metal-edge" x1="128" y1="116" x2="128" y2="224" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F8FAFC" stop-opacity="0.72"/>
      <stop offset="0.35" stop-color="#94A3B8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#0F172A" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tf-leg-sheen" x1="128" y1="124" x2="128" y2="218" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.42" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="tf-foot" cx="30%" cy="24%" r="78%">
      <stop offset="0" stop-color="#F1F5F9"/>
      <stop offset="0.32" stop-color="#94A3B8"/>
      <stop offset="0.78" stop-color="#1E293B"/>
      <stop offset="1" stop-color="#020617"/>
    </radialGradient>

    <!-- Jewel aperture ring -->
    <linearGradient id="tf-ring" x1="72" y1="12" x2="184" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF8E1"/>
      <stop offset="0.2" stop-color="#FFD54F"/>
      <stop offset="0.42" stop-color="#FF8F00"/>
      <stop offset="0.62" stop-color="#FF5722"/>
      <stop offset="0.82" stop-color="#E91E63"/>
      <stop offset="1" stop-color="#AD1457"/>
    </linearGradient>
    <linearGradient id="tf-ring-bevel" x1="128" y1="16" x2="128" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.75"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="tf-ring-inner" x1="104" y1="30" x2="152" y2="74" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="tf-bowl" cx="48%" cy="38%" r="62%">
      <stop offset="0" stop-color="#1F1635"/>
      <stop offset="0.5" stop-color="#0C0A1C"/>
      <stop offset="1" stop-color="#030208"/>
    </radialGradient>
    <radialGradient id="tf-bowl-rim" cx="50%" cy="50%" r="50%">
      <stop offset="0.72" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.45"/>
    </radialGradient>

    <!-- Aperture blades -->
    <linearGradient id="tf-bladeA" x1="128" y1="20" x2="128" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFDE7"/>
      <stop offset="0.38" stop-color="#FFCA28"/>
      <stop offset="1" stop-color="#EF6C00"/>
    </linearGradient>
    <linearGradient id="tf-bladeB" x1="128" y1="20" x2="128" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFE0B2"/>
      <stop offset="0.4" stop-color="#FF7043"/>
      <stop offset="1" stop-color="#BF360C"/>
    </linearGradient>
    <linearGradient id="tf-bladeC" x1="128" y1="20" x2="128" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FCE4EC"/>
      <stop offset="0.4" stop-color="#F06292"/>
      <stop offset="1" stop-color="#C62828"/>
    </linearGradient>

    <radialGradient id="tf-iris" cx="42%" cy="36%" r="64%">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.12" stop-color="#FFF9C4"/>
      <stop offset="0.38" stop-color="#FFB74D"/>
      <stop offset="0.68" stop-color="#FF6D00"/>
      <stop offset="0.9" stop-color="#E65100"/>
      <stop offset="1" stop-color="#7F0000"/>
    </radialGradient>

    <filter id="tf-soft-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1" stdDeviation="2.5" flood-color="#FFAB40" flood-opacity="0.42"/>
      <feDropShadow dx="0" dy="6" stdDeviation="11" flood-color="#FF3D00" flood-opacity="0.22"/>
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#FF1744" flood-opacity="0.08"/>
    </filter>
    <filter id="tf-lens-glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="4.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="tf-contact" x="-80%" y="-20%" width="260%" height="160%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
    <filter id="tf-hub-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Ambient brand wash -->
  <ellipse cx="128" cy="134" rx="96" ry="100" fill="#FF6D00" opacity="0.028"/>
  <ellipse cx="128" cy="50" rx="52" ry="46" fill="#FF8A65" opacity="0.075"/>
  <ellipse cx="128" cy="50" rx="40" ry="36" fill="#FFD180" opacity="0.04"/>

  <g filter="url(#tf-soft-glow)">
    <!-- Tripod legs -->
    <path d="M128 120 Q92 158 36 208" stroke="url(#tf-metal)" stroke-width="11" stroke-linecap="round" fill="none"/>
    <path d="M128 120 Q164 158 220 208" stroke="url(#tf-metal)" stroke-width="11" stroke-linecap="round" fill="none"/>
    <path d="M128 120 L128 218" stroke="url(#tf-metal)" stroke-width="9" stroke-linecap="round" fill="none"/>

    <!-- Leg sheen -->
    <path d="M128 126 Q100 160 46 202" stroke="url(#tf-leg-sheen)" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <path d="M128 126 Q156 160 210 202" stroke="url(#tf-leg-sheen)" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <path d="M128 130 L128 212" stroke="url(#tf-leg-sheen)" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.85"/>

    <!-- Edge highlights -->
    <path d="M128 126 Q104 158 50 198" stroke="url(#tf-metal-edge)" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <path d="M128 126 Q152 158 206 198" stroke="url(#tf-metal-edge)" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <path d="M128 130 L128 210" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.2"/>

    <!-- Foot contact shadows -->
    <ellipse cx="36" cy="214" rx="11" ry="3.8" fill="#0F172A" opacity="0.26" filter="url(#tf-contact)"/>
    <ellipse cx="220" cy="214" rx="11" ry="3.8" fill="#0F172A" opacity="0.26" filter="url(#tf-contact)"/>
    <ellipse cx="128" cy="228" rx="10" ry="3.2" fill="#0F172A" opacity="0.24" filter="url(#tf-contact)"/>

    <!-- Ball feet -->
    <circle cx="36" cy="208" r="8" fill="url(#tf-foot)"/>
    <circle cx="220" cy="208" r="8" fill="url(#tf-foot)"/>
    <circle cx="128" cy="222" r="7.5" fill="url(#tf-foot)"/>
    <circle cx="33" cy="205" r="2.5" fill="#FFFFFF" opacity="0.5"/>
    <circle cx="217" cy="205" r="2.5" fill="#FFFFFF" opacity="0.5"/>
    <circle cx="125.5" cy="219" r="2.2" fill="#FFFFFF" opacity="0.44"/>

    <!-- Machined hub -->
    <g filter="url(#tf-hub-shadow)">
      <circle cx="128" cy="112" r="10" fill="url(#tf-metal)" stroke="#334155" stroke-width="0.9"/>
      <circle cx="128" cy="112" r="6.5" fill="none" stroke="#94A3B8" stroke-width="0.7" opacity="0.5"/>
      <circle cx="128" cy="112" r="3.2" fill="none" stroke="#CBD5E1" stroke-width="0.45" opacity="0.35"/>
    </g>
    <circle cx="125.5" cy="109.5" r="2.4" fill="#FFFFFF" opacity="0.32"/>

    <!-- Stem -->
    <rect x="118.5" y="78" width="19" height="30" rx="4" fill="url(#tf-metal)"/>
    <rect x="121" y="80" width="3" height="26" rx="1.4" fill="#FFFFFF" opacity="0.22"/>
    <rect x="132" y="82" width="1.2" height="22" rx="0.6" fill="#000000" opacity="0.12"/>

    <!-- Lens housing -->
    <circle cx="128" cy="50" r="38" fill="url(#tf-bowl)"/>
    <circle cx="128" cy="50" r="38" fill="url(#tf-bowl-rim)"/>
    <circle cx="128" cy="50" r="38" stroke="url(#tf-ring)" stroke-width="6.5" fill="none"/>
    <circle cx="128" cy="50" r="35.2" stroke="url(#tf-ring-bevel)" stroke-width="1.4" fill="none" opacity="0.9"/>
    <circle cx="128" cy="50" r="32" stroke="url(#tf-ring-inner)" stroke-width="1.3" fill="none" opacity="0.88"/>

    <!-- Blade shadows -->
    <g transform="translate(128 50)" opacity="0.38">
      <path d="M0 -29 C11 -27 18 -17 16 -4 L0 8 L-16 -4 C-18 -17 -11 -27 0 -29 Z" fill="#0A0614" transform="rotate(0)"/>
      <path d="M0 -29 C11 -27 18 -17 16 -4 L0 8 L-16 -4 C-18 -17 -11 -27 0 -29 Z" fill="#0A0614" transform="rotate(120)"/>
      <path d="M0 -29 C11 -27 18 -17 16 -4 L0 8 L-16 -4 C-18 -17 -11 -27 0 -29 Z" fill="#0A0614" transform="rotate(240)"/>
    </g>

    <!-- Aperture blades -->
    <g transform="translate(128 50)">
      <path d="M0 -29 C11 -27 18 -17 16 -4 L0 8 L-16 -4 C-18 -17 -11 -27 0 -29 Z" fill="url(#tf-bladeA)"/>
      <path d="M0 -29 C11 -27 18 -17 16 -4 L0 8 L-16 -4 C-18 -17 -11 -27 0 -29 Z" fill="url(#tf-bladeB)" transform="rotate(120)"/>
      <path d="M0 -29 C11 -27 18 -17 16 -4 L0 8 L-16 -4 C-18 -17 -11 -27 0 -29 Z" fill="url(#tf-bladeC)" transform="rotate(240)"/>
    </g>

    <!-- Glass core -->
    <g filter="url(#tf-lens-glow)">
      <circle cx="128" cy="50" r="13" fill="url(#tf-iris)"/>
    </g>
    <ellipse cx="119" cy="41" rx="11" ry="7" fill="#FFFFFF" opacity="0.52"/>
    <ellipse cx="119" cy="41" rx="5" ry="3" fill="#FFFFFF" opacity="0.28"/>
    <circle cx="135" cy="55" r="3" fill="#FFFFFF" opacity="0.68"/>
    <circle cx="123" cy="57" r="1.3" fill="#FFFFFF" opacity="0.4"/>
    <circle cx="131" cy="47" r="0.8" fill="#FFFFFF" opacity="0.55"/>
  </g>
</svg>
